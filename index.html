<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Finance Tracker</title>

  <meta name="theme-color" content="#070707" />

  <link rel="manifest" href="manifest.json" />

  <link rel="stylesheet" href="css/app.css" />
  <link rel="stylesheet" href="css/dashboard.css" />
  <link rel="stylesheet" href="css/analytics.css" />
  <link rel="stylesheet" href="css/modal.css" />

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>

<body>

  <div id="app">

    <header class="hero">

      <div class="hero-top">

        <div>
          <p class="sub">
            Personal Finance
          </p>

          <h1>
            Finance Tracker
          </h1>
        </div>

        <button class="add-btn" id="addTransactionBtn">
          +
        </button>

      </div>

      <div class="balance-card">

        <p>Total Balance</p>

        <h2 id="balanceAmount">
          ₹0
        </h2>

        <div class="balance-stats">

          <div>
            <span>Income</span>
            <strong id="incomeAmount">₹0</strong>
          </div>

          <div>
            <span>Expense</span>
            <strong id="expenseAmount">₹0</strong>
          </div>

        </div>

      </div>

    </header>

    <section class="analytics-grid">

      <div class="card chart-card">
        <h3>Expense Breakdown</h3>
        <canvas id="expenseDonut"></canvas>
      </div>

      <div class="card chart-card">
        <h3>Cash Flow Trend</h3>
        <canvas id="cashflowChart"></canvas>
      </div>

    </section>

    <section class="transactions-section">

      <div class="section-header">
        <h3>Recent Transactions</h3>
      </div>

      <div id="transactionList"></div>

    </section>

  </div>

  <div class="modal-overlay hidden" id="transactionModal">

    <div class="modal">

      <h2>Add Transaction</h2>

      <div class="type-toggle">

        <button
          class="type active"
          data-type="expense"
        >
          Expense
        </button>

        <button
          class="type"
          data-type="income"
        >
          Income
        </button>

      </div>

      <input
        type="number"
        id="amountInput"
        placeholder="Amount"
      />

      <select id="categorySelect"></select>

      <input
        type="text"
        id="noteInput"
        placeholder="Note"
      />

      <input
        type="text"
        id="locationInput"
        placeholder="Location"
      />

      <button id="saveTransactionBtn">
        Save Transaction
      </button>

    </div>

  </div>

  <script type="module" src="js/app.js"></script>

</body>
</html>
